env:
  - variable: NEXT_PUBLIC_SUPABASE_URL
    value: https://hvloodegutmwxbabdsjf.supabase.co
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_SUPABASE_ANON_KEY
    value: sb_publishable_XbrL_W6J3T2wmKX898y-hA_ZKcjDCcJ
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_SITE_URL
    value: https://inovaai.ai
    availability:
      - BUILD
      - RUNTIME

# 포트원 V2 — "실연동"(live) 모드. NHN KCP 자동결제 계약·서류심사 완료 후
# 실연동 채널(sniff_Web)로 전환했다. 카드사 등록심사 체크사항 5번("테스트
# 결제창인 경우 심사 불가")을 통과하려면 실 결제창이 호출되어야 한다.
#
# 아래 두 값은 NEXT_PUBLIC_* 로 브라우저 번들에 인라인되는 공개 식별자다
# (비밀값 아님). 실제 비밀값은 PORTONE_API_SECRET 뿐이고 Secret Manager에 둔다.
# KCP SITE KEY는 포트원 콘솔에만 입력하며 이 저장소에 들어오지 않는다.
#
  - variable: NEXT_PUBLIC_PORTONE_STORE_ID
    value: store-4e3f5aad-b792-4c2b-bd87-b199a8cfad43
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_PORTONE_CHANNEL_KEY
    value: channel-key-c8189a61-c04d-4781-a4bd-012ecce1efce
    availability:
      - BUILD
      - RUNTIME

# 연동 모드. 채널 키는 `channel-key-{UUID}` 고정 형식이라 문자열로는 테스트/실결제를
# 구분할 수 없어, 모드를 이 변수로 명시한다.
# 미설정 시 코드가 실결제로 간주하므로 빠뜨려도 테스트로 오인되지는 않는다.
#
# !! 위 channelKey 와 항상 함께 움직여야 한다. 둘 중 하나만 바꾸면 화면 표시와
#    실제 결제 동작이 어긋난다.
  - variable: NEXT_PUBLIC_PORTONE_MODE
    value: live
    availability:
      - BUILD
      - RUNTIME
#
# 웹훅 시크릿은 평문 금지 — Cloud Secret Manager에 저장 후 secret: 으로 참조한다.
# (`firebase apphosting:secrets:set portone-webhook-secret` 로 등록)
#
#  - variable: PORTONE_WEBHOOK_SECRET
#    secret: portone-webhook-secret
#    availability:
#      - RUNTIME
#
#  - variable: PORTONE_API_SECRET
#    secret: portone-api-secret
#    availability:
#      - RUNTIME

# 출시 전 서비스(sniff-hospital, csv-automation, fem-ai) 메뉴 노출 토글.
# 미설정이 곧 '숨김'이라 지금은 주석으로 두는 것으로 충분하다.
# KCP 심사가 끝나면 아래 주석을 풀고 value를 "true"로 두면 메뉴가 복구된다.
# NEXT_PUBLIC_* 이므로 빌드 타임에 인라인된다 — 빈 문자열로 넣지 말 것.
#
#  - variable: NEXT_PUBLIC_SHOW_UPCOMING_SERVICES
#    value: "true"
#    availability:
#      - BUILD
#      - RUNTIME
